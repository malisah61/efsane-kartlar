name: Google Play AAB (Godot 4.7 + Play Billing)

# Google Play paketi: Godot 4.7.2 (16 KB sayfa, API 36), gradle derlemesi,
# Google Play Billing eklentisi, yükleme anahtarıyla imzalı .aab.
# Gerekli depo sırları (Settings → Secrets and variables → Actions):
#   PLAY_KEYSTORE_BASE64   : efsane-kartlar-yukleme.keystore dosyasının base64 hali
#   PLAY_KEYSTORE_PASSWORD : anahtar şifresi (takma ad: yukleme)
# Sırlar yoksa yalnızca hata ayıklama imzalı deneme APK'sı üretilir.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "tasarim/**"
      - "onizleme/**"
      - "README.md"
      - "*.md"

permissions:
  contents: write

env:
  GV: "4.7.2"

jobs:
  play:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Godot ${{ env.GV }} (C#) ve şablonlar
        run: |
          V=${GV}-stable
          T=$HOME/.local/share/godot/export_templates/${GV}.stable.mono
          curl -fsSL https://github.com/godotengine/godot/releases/download/$V/Godot_v${V}_mono_linux_x86_64.zip -o g.zip
          unzip -q g.zip -d $HOME/godot && rm g.zip
          sudo ln -sf $HOME/godot/Godot_v${V}_mono_linux_x86_64/Godot_v${V}_mono_linux.x86_64 /usr/local/bin/godot
          curl -fsSL https://github.com/godotengine/godot/releases/download/$V/Godot_v${V}_mono_export_templates.tpz -o t.tpz
          mkdir -p $T
          unzip -q -j t.tpz "templates/android*" "templates/version.txt" -d $T && rm t.tpz
          ls $T
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore $HOME/debug.keystore \
            -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          MM=$(echo $GV | cut -d. -f1,2)
          mkdir -p $HOME/.config/godot
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo '[resource]'
            echo "export/android/android_sdk_path = \"$ANDROID_HOME\""
            echo "export/android/java_sdk_path = \"$JAVA_HOME\""
            echo "export/android/debug_keystore = \"$HOME/debug.keystore\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
          } > $HOME/.config/godot/editor_settings-$MM.tres

      - name: Projeyi Godot 4.7'ye taşı
        run: |
          MM=$(echo $GV | cut -d. -f1,2)
          sed -i "s#Godot.NET.Sdk/[0-9.]*#Godot.NET.Sdk/${GV}#" EfsaneKartlar.csproj
          sed -i "s#\"4.3\", \"C\#\"#\"${MM}\", \"C\#\"#" project.godot
          sed -i "s#^version/code=1\$#version/code=${GITHUB_RUN_NUMBER}#" export_presets.cfg
          sed -i "s#^version/name=\"1.0\"\$#version/name=\"1.0.${GITHUB_RUN_NUMBER}\"#" export_presets.cfg
          grep -n "Sdk" EfsaneKartlar.csproj; grep -n features project.godot

      - name: Google Play Billing eklentisini derle
        run: |
          git clone -q --depth 1 https://github.com/godot-sdk-integrations/godot-google-play-billing.git $HOME/gpb
          cd $HOME/gpb
          git log -1 --format="%h %s"
          chmod +x gradlew
          ./gradlew assemble --no-daemon -q > $HOME/gpb.txt 2>&1 || { tail -80 $HOME/gpb.txt; exit 1; }
          echo "--- üretilen aar dosyaları:"; find . -name "*.aar" -not -path "*/intermediates/*" | head
          H=$GITHUB_WORKSPACE/addons/GodotGooglePlayBilling
          rm -rf $H; mkdir -p $H/bin/debug $H/bin/release
          D=$(find . -type d -path "*addons/GodotGooglePlayBilling" -not -path "*/intermediates/*" | head -1)
          if [ -n "$D" ] && [ -d "$D/bin" ]; then cp -r "$D"/. $H/; else
            cp godot-google-play-billing/export_scripts/* $H/
            DA=$(find . -name "*debug*.aar" -not -path "*/intermediates/*" | head -1)
            RA=$(find . -name "*release*.aar" -not -path "*/intermediates/*" | head -1)
            cp "$DA" $H/bin/debug/GodotGooglePlayBilling-debug.aar
            cp "$RA" $H/bin/release/GodotGooglePlayBilling-release.aar
          fi
          grep -n "aar" $H/export_plugin.gd | head
          ls -R $H
          cd $GITHUB_WORKSPACE
          grep -q "^\[editor_plugins\]" project.godot || printf '\n[editor_plugins]\n\nenabled=PackedStringArray("res://addons/GodotGooglePlayBilling/plugin.cfg")\n' >> project.godot
          cat addons/GodotGooglePlayBilling/plugin.cfg

      - name: Android gradle şablonunu kur
        run: |
          T=$HOME/.local/share/godot/export_templates/${GV}.stable.mono
          mkdir -p android/build
          unzip -q -o $T/android_source.zip -d android/build
          echo -n "${GV}.stable.mono" > android/.build_version
          touch android/build/.gdignore
          godot --headless --editor --quit > build_editor.txt 2>&1 || true
          tail -30 build_editor.txt

      - name: Yükleme anahtarı
        id: anahtar
        env:
          KS: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
          KP: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ] && [ -n "$KP" ]; then
            echo "$KS" | base64 -d > $HOME/yukleme.keystore
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$HOME/yukleme.keystore" >> $GITHUB_ENV
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=yukleme" >> $GITHUB_ENV
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KP" >> $GITHUB_ENV
            echo "var=1" >> $GITHUB_OUTPUT
          else
            echo "::warning::PLAY_KEYSTORE_* sırları yok; yalnızca deneme APK'sı üretilecek."
            echo "var=0" >> $GITHUB_OUTPUT
          fi

      - name: Dışa aktar
        run: |
          mkdir -p build/play
          if [ "${{ steps.anahtar.outputs.var }}" = "1" ]; then
            godot --headless --export-release "Google Play" build/play/EfsaneKartlar.aab > build/play.txt 2>&1 || true
            OUT=build/play/EfsaneKartlar.aab
          else
            sed -i 's#^gradle_build/export_format=1#gradle_build/export_format=0#' export_presets.cfg
            godot --headless --export-debug "Google Play" build/play/EfsaneKartlar-play-deneme.apk > build/play.txt 2>&1 || true
            OUT=build/play/EfsaneKartlar-play-deneme.apk
          fi
          tail -80 build/play.txt
          ls -la build/play
          test -f $OUT
          unzip -l $OUT | grep -iE "EfsaneKartlar.dll|billing" | head
          unzip -l $OUT | grep -q "EfsaneKartlar.dll" || { echo "HATA: C# derlemesi pakette yok"; exit 1; }
          echo "CIKTI=$OUT" >> $GITHUB_ENV

      - name: Kaydı depoya yaz
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/k && { echo "durum: ${{ job.status }}"; tail -60 $HOME/gpb.txt 2>/dev/null; tail -120 build/play.txt 2>/dev/null; } > /tmp/k/play.txt
          mkdir -p onizleme && cp /tmp/k/play.txt onizleme/play.txt
          git add onizleme/play.txt
          git commit -qm "Google Play derleme kaydı" || true
          for i in 1 2 3 4; do git pull --rebase --autostash -q && git push -q && break; sleep 5; done || true

      - uses: actions/upload-artifact@v4
        with:
          name: EfsaneKartlar-GooglePlay
          path: build/play/*

      - name: Sürüme yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: play-surum
          name: Efsane Kartlar (Google Play paketi)
          body: Google Play Console'a yüklenecek .aab (veya sırlar yoksa deneme APK'sı).
          make_latest: false
          files: build/play/*
